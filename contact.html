<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRÉA | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVIGAȚIE -->
    <nav>
        <div class="logo">MIRÉA</div>
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li><a href="colectie.html">Colecția</a></li>
            <li><a href="lookbook.html">Lookbook</a></li>
            <li><a href="despre.html">Despre</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- SECȚIUNE CONTACT -->
    <main class="contact-container">
        <header class="contact-header">
            <h1>CONTACT</h1>
            <p>Scrie-ne. Suntem aici pentru tine.</p>
        </header>

        <div class="contact-grid">
            <!-- Detalii Stânga -->
            <div class="contact-details">
                <div class="info-group">
                    <h3>EMAIL</h3>
                    <p><a href="mailto:butuc.aliona2006@gmail.com">butuc.aliona2006@gmail.com</a></p>
                </div>
                <div class="info-group">
                    <h3>INSTAGRAM</h3>
                    <p><a href="https://instagram.com/mirea.store" target="_blank">@mirea.store</a></p>
                </div>
            </div>

            <!-- Formular Dreapta -->
            <div class="form-container">
                <!-- Formularul este gestionat prin script.js pentru a evita redirecționarea -->
                <form id="contactForm" class="contact-form">
                    <input type="text" name="nume" id="nume" placeholder="NUME COMPLET" required>
                    <input type="email" name="email" id="email" placeholder="ADRESA EMAIL" required>
                    <textarea name="mesaj" id="mesaj" placeholder="MESAJUL TĂU" rows="5" required></textarea>
                    
                    <button type="submit" id="submitBtn">TRIMITE</button>
                </form>
                <!-- Locul unde va apărea mesajul de succes sau eroare -->
                <div id="responseMessage" style="margin-top: 20px; font-size: 0.9rem; min-height: 20px;"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
