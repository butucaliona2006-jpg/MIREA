<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRÉA | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">MIRÉA</div>
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li><a href="colectie.html">Colecția</a></li>
            <li><a href="lookbook.html">Lookbook</a></li>
            <li><a href="despre.html">Despre</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Contact</h1>
        <p>Scrie-ne. Suntem aici pentru tine.</p>

        <div class="contact-info">
            <p>Email: 
                <a href="mailto:mirea@gmail.com">mirea@gmail.com</a>
            </p>
            <p>Instagram: 
                <a href="https://instagram.com/mirea.store" target="_blank">
                    @mirea.store
                </a>
            </p>
        </div>

        <!-- Formular de contact -->
        <div class="contact-form-container">
            <h2>Trimite-ne un mesaj</h2>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Nume complet *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subiect</label>
                    <select id="subject" name="subject">
                        <option value="intrebare">Întrebare</option>
                        <option value="comanda">Comandă</option>
                        <option value="colaborare">Colaborare</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Mesaj *</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Vreau să primesc noutăți pe email
                    </label>
                </div>

                <button type="submit" class="submit-btn">Trimite mesaj</button>
            </form>
            <div id="formMessage" class="form-message"></div>
        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
