<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRÉA | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVIGAȚIE -->
    <nav>
        <div class="logo">MIRÉA</div>
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li><a href="colectie.html">Colecția</a></li>
            <li><a href="lookbook.html">Lookbook</a></li>
            <li><a href="despre.html">Despre</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- SECȚIUNE CONTACT -->
    <main class="contact-container">
        <header class="contact-header">
            <h1>CONTACT</h1>
            <p>Scrie-ne. Suntem aici pentru tine.</p>
        </header>

        <div class="contact-container">
    

    <div class="contact-content">
        <div class="contact-info">
            <div class="info-item">
                <h3>EMAIL</h3>
                <a href="mailto:butuc.aliona2006@gmail.com">butuc.aliona2006@gmail.com</a>
            </div>
            <div class="info-item">
                <h3>INSTAGRAM</h3>
                <a href="https://instagram.com/mirea.store" target="_blank">@mirea.store</a>
            </div>
        </div>

        <!-- Formularul cu ID pentru AJAX -->
        <form id="contactForm" class="contact-form">
            <div class="input-group">
                <input type="text" name="nume" placeholder="NUME" required>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="EMAIL" required>
            </div>
            <div class="input-group">
                <textarea name="mesaj" placeholder="MESAJUL TĂU" rows="5" required></textarea>
            </div>
            <button type="submit" id="submitBtn" class="btn-trimite">TRIMITE MESAJ</button>
            <!-- Aici va apărea mesajul de succes -->
            <div id="responseMessage" style="margin-top: 20px; font-size: 0.8rem; letter-spacing: 2px; color: #4A4A4A; display: none;"></div>
        </form>
    </div>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Oprește deschiderea paginii albe PHP
    
    const btn = document.getElementById('submitBtn');
    const responseDiv = document.getElementById('responseMessage');
    const formData = new FormData(this);

    btn.innerText = "SE TRIMITE...";
    btn.disabled = true;

    fetch('contact.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.text())
    .then(data => {
        responseDiv.innerText = "MESAJ TRIMIS CU SUCCES!";
        responseDiv.style.display = "block";
        btn.innerText = "TRIMITE MESAJ";
        btn.disabled = false;
        this.reset(); // Șterge textul din câmpuri
    })
    .catch(error => {
        responseDiv.innerText = "A APĂRUT O EROARE. ÎNCEARCĂ DIN NOU.";
        responseDiv.style.display = "block";
        btn.disabled = false;
    });
});
</script>
</body>
</html>
