<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRÉA | Lookbook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">MIRÉA</div>
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li><a href="colectie.html">Colecția</a></li>
            <li><a href="lookbook.html">Lookbook</a></li>
            <li><a href="despre.html">Despre</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Lookbook</h1>
        <p>Inspirație minimalistă pentru fiecare zi.</p>
    </header>

    <section class="grid lookbook-grid">
        <div class="item lookbook-item" data-look="1">
            <div class="look-content">
                <span class="look-number">01</span>
                <span class="look-title">Eleganță urbană</span>
                <button class="view-detail">Vezi detaliu</button>
            </div>
        </div>
        <div class="item lookbook-item" data-look="2">
            <div class="look-content">
                <span class="look-number">02</span>
                <span class="look-title">Minimalism natural</span>
                <button class="view-detail">Vezi detaliu</button>
            </div>
        </div>
        <div class="item lookbook-item" data-look="3">
            <div class="look-content">
                <span class="look-number">03</span>
                <span class="look-title">Serenity</span>
                <button class="view-detail">Vezi detaliu</button>
            </div>
        </div>
    </section>

    <!-- Modal pentru detalii look -->
    <div id="lookModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            <div id="modalDetails"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
